<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise KPI Consolidation &amp; Dashboard Automation | Case Study</title>
    <meta
      name="description"
      content="A premium BI and data operations case study for enterprise KPI consolidation, Power Query automation, data modeling, and dashboard integration."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://berfinida.com.tr/enterprise-kpi-case-study.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Enterprise KPI Consolidation &amp; Dashboard Automation" />
    <meta
      property="og:description"
      content="A multi-department KPI reporting system standardized into a centralized, dashboard-ready data architecture."
    />
    <meta property="og:url" content="https://berfinida.com.tr/enterprise-kpi-case-study.html" />
    <meta name="theme-color" content="#06111f" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
            },
            colors: {
              ink: '#06111f',
              panel: 'rgba(10, 24, 43, 0.72)',
              cyanline: 'rgba(125, 211, 252, 0.26)'
            },
            boxShadow: {
              glow: '0 0 50px rgba(34, 211, 238, 0.14)',
              card: '0 24px 90px rgba(0, 0, 0, 0.38)'
            }
          }
        }
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "framer-motion": "https://esm.sh/framer-motion@11.18.2?external=react"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #06111f;
        color: #e5edf7;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .bg-mesh {
        background:
          radial-gradient(circle at 18% 12%, rgba(34, 211, 238, 0.22), transparent 28%),
          radial-gradient(circle at 78% 8%, rgba(99, 102, 241, 0.18), transparent 30%),
          radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.14), transparent 26%),
          linear-gradient(180deg, #06111f 0%, #071827 46%, #050a14 100%);
      }

      .glass {
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: linear-gradient(180deg, rgba(15, 32, 56, 0.78), rgba(8, 18, 34, 0.7));
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .hairline {
        background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.48), transparent);
      }

      .grid-surface {
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { motion } from 'framer-motion';

      const h = React.createElement;

      const tags = [
        'Excel',
        'Power Query',
        'KPI Reporting',
        'Dashboard Integration',
        'Data Transformation',
        'Data Modeling'
      ];

      const workflow = [
        'Department KPI Files',
        'Data Standardization',
        'Power Query Consolidation',
        'Unified KPI Data Model',
        'Dashboard Integration'
      ];

      const features = [
        ['Multi-department consolidation', 'Standardized KPI files from different business units into one reporting flow.'],
        ['Dynamic refresh structure', 'Created a repeatable update logic for new monthly and departmental KPI files.'],
        ['Scalable architecture', 'Designed the model so future departments can be added without rebuilding the system.'],
        ['Dashboard-ready data model', 'Prepared clean KPI dimensions, periods, ownership fields, and measurable values.'],
        ['Automated transformation workflow', 'Reduced manual reshaping through Power Query transformation steps.'],
        ['Flexible schema support', 'Mapped inconsistent source layouts into a stable enterprise KPI schema.']
      ];

      const impact = [
        ['Centralized', 'KPI management'],
        ['Reduced', 'manual reporting effort'],
        ['Scalable', 'reporting workflow'],
        ['Improved', 'management visibility']
      ];

      const fadeUp = {
        initial: { opacity: 0, y: 28 },
        whileInView: { opacity: 1, y: 0 },
        viewport: { once: true, margin: '-80px' },
        transition: { duration: 0.7, ease: 'easeOut' }
      };

      function Section(props) {
        return h(
          motion.section,
          {
            className: 'mx-auto w-full max-w-7xl px-5 py-14 sm:px-8 lg:px-10 lg:py-20',
            ...fadeUp
          },
          props.children
        );
      }

      function SectionTitle({ eyebrow, title, copy }) {
        return h(
          'div',
          { className: 'mb-9 max-w-3xl' },
          h('p', { className: 'mb-3 text-xs font-semibold uppercase tracking-[0.28em] text-cyan-300/80' }, eyebrow),
          h('h2', { className: 'text-3xl font-semibold tracking-tight text-white sm:text-4xl lg:text-5xl' }, title),
          copy && h('p', { className: 'mt-4 text-base leading-8 text-slate-300 sm:text-lg' }, copy)
        );
      }

      function DashboardPreview() {
        const bars = [78, 54, 92, 66, 84, 48, 73];
        return h(
          motion.div,
          {
            className: 'glass relative overflow-hidden rounded-[2rem] p-5 shadow-card',
            initial: { opacity: 0, scale: 0.96, y: 24 },
            animate: { opacity: 1, scale: 1, y: 0 },
            transition: { duration: 0.8, delay: 0.15, ease: 'easeOut' }
          },
          h('div', { className: 'absolute inset-0 grid-surface opacity-30' }),
          h(
            'div',
            { className: 'relative' },
            h(
              'div',
              { className: 'mb-5 flex items-center justify-between border-b border-white/10 pb-4' },
              h('div', null, h('p', { className: 'text-sm text-slate-400' }, 'Management KPI Dashboard'), h('h3', { className: 'text-xl font-semibold text-white' }, 'Executive Performance View')),
              h('div', { className: 'rounded-full border border-emerald-300/30 bg-emerald-300/10 px-3 py-1 text-xs font-semibold text-emerald-200' }, 'Refreshable')
            ),
            h(
              'div',
              { className: 'grid gap-3 sm:grid-cols-3' },
              ['Revenue KPI', 'Operations', 'Service Quality'].map((item, index) =>
                h(
                  'div',
                  { key: item, className: 'rounded-2xl border border-white/10 bg-white/[0.04] p-4' },
                  h('p', { className: 'text-xs uppercase tracking-[0.2em] text-slate-500' }, item),
                  h('div', { className: 'mt-3 text-2xl font-semibold text-white' }, ['94.2%', '87.6%', '91.8%'][index]),
                  h('div', { className: 'mt-3 h-1.5 overflow-hidden rounded-full bg-white/10' }, h('div', { className: 'h-full rounded-full bg-cyan-300', style: { width: ['94%', '88%', '92%'][index] } }))
                )
              )
            ),
            h(
              'div',
              { className: 'mt-4 grid gap-4 lg:grid-cols-[1.2fr_.8fr]' },
              h(
                'div',
                { className: 'rounded-2xl border border-white/10 bg-white/[0.04] p-4' },
                h('div', { className: 'mb-4 flex items-center justify-between' }, h('p', { className: 'font-medium text-white' }, 'Monthly KPI Trend'), h('span', { className: 'text-xs text-cyan-200' }, 'Power Query source')),
                h(
                  'div',
                  { className: 'flex h-44 items-end gap-3' },
                  bars.map((value, index) =>
                    h(
                      'div',
                      { key: index, className: 'flex flex-1 flex-col items-center gap-2' },
                      h(motion.div, {
                        className: 'w-full rounded-t-xl bg-gradient-to-t from-cyan-400 to-indigo-300',
                        initial: { height: 18 },
                        animate: { height: `${value}%` },
                        transition: { duration: 0.9, delay: 0.45 + index * 0.04 }
                      }),
                      h('span', { className: 'text-[10px] text-slate-500' }, `M${index + 1}`)
                    )
                  )
                )
              ),
              h(
                'div',
                { className: 'rounded-2xl border border-white/10 bg-white/[0.04] p-4' },
                h('p', { className: 'mb-4 font-medium text-white' }, 'Data Model Health'),
                ['Unified schema', 'Normalized periods', 'Refresh checks', 'Dashboard mapping'].map((row, index) =>
                  h(
                    'div',
                    { key: row, className: 'mb-3 flex items-center justify-between rounded-xl bg-white/[0.04] px-3 py-2' },
                    h('span', { className: 'text-sm text-slate-300' }, row),
                    h('span', { className: 'text-xs font-semibold text-emerald-200' }, ['Ready', 'Clean', 'Active', 'Linked'][index])
                  )
                )
              )
            )
          )
        );
      }

      function App() {
        return h(
          'main',
          { className: 'bg-mesh min-h-screen overflow-hidden' },
          h(
            'div',
            { className: 'pointer-events-none fixed inset-0 opacity-60' },
            h('div', { className: 'absolute left-1/2 top-0 h-px w-[70vw] -translate-x-1/2 bg-cyan-200/30' }),
            h('div', { className: 'absolute right-0 top-24 h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl' })
          ),
          h(
            'nav',
            { className: 'relative z-10 mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-6 sm:px-8 lg:px-10' },
            h('a', { href: 'index.html', className: 'text-sm font-semibold text-slate-300 transition hover:text-white' }, 'Berfin Nida Portfolio'),
            h('a', { href: 'index.html#projects', className: 'rounded-full border border-white/15 px-4 py-2 text-sm text-slate-200 transition hover:border-cyan-300/50 hover:bg-cyan-300/10' }, 'Back to projects')
          ),
          h(
            'section',
            { className: 'relative z-10 mx-auto grid w-full max-w-7xl items-center gap-10 px-5 pb-14 pt-10 sm:px-8 lg:grid-cols-[1fr_.9fr] lg:px-10 lg:pb-24 lg:pt-16' },
            h(
              motion.div,
              { initial: { opacity: 0, y: 26 }, animate: { opacity: 1, y: 0 }, transition: { duration: 0.8 } },
              h('div', { className: 'mb-6 inline-flex rounded-full border border-cyan-200/20 bg-cyan-200/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.28em] text-cyan-200' }, 'BI Operations Case Study'),
              h('h1', { className: 'max-w-4xl text-5xl font-semibold leading-[0.95] tracking-tight text-white sm:text-6xl lg:text-7xl' }, 'Enterprise KPI Consolidation & Dashboard Automation'),
              h('p', { className: 'mt-7 max-w-2xl text-lg leading-8 text-slate-300 sm:text-xl' }, 'A multi-department KPI reporting system where inconsistent Excel files were standardized, consolidated into a central reporting architecture, and prepared for a refreshable management dashboard workflow.'),
              h(
                'div',
                { className: 'mt-8 flex flex-wrap gap-3' },
                tags.map(tag => h('span', { key: tag, className: 'rounded-full border border-white/12 bg-white/[0.06] px-4 py-2 text-sm text-slate-200 shadow-glow' }, tag))
              )
            ),
            h(DashboardPreview)
          ),
          h('div', { className: 'hairline mx-auto h-px w-full max-w-7xl' }),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Problem',
              title: 'Fragmented KPI reporting across departments',
              copy: 'KPI data arrived from multiple departments in inconsistent Excel formats. Reporting was fragmented, management lacked a centralized KPI structure, and future department files needed to be scalable, repeatable, and refreshable.'
            }),
            h(
              'div',
              { className: 'grid gap-4 md:grid-cols-2 lg:grid-cols-4' },
              ['Inconsistent source files', 'Fragmented reporting logic', 'No central KPI model', 'Manual update risk'].map(item =>
                h('div', { key: item, className: 'glass rounded-3xl p-5 transition duration-300 hover:-translate-y-1 hover:border-cyan-300/40' }, h('p', { className: 'text-lg font-semibold text-white' }, item), h('p', { className: 'mt-3 text-sm leading-6 text-slate-400' }, 'A recurring reporting blocker that made scale, governance, and dashboard refreshes harder than necessary.'))
              )
            )
          ),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Solution',
              title: 'A centralized KPI master structure built for refresh',
              copy: 'The solution standardized all department files into a unified schema, introduced a centralized KPI master table, used Power Query for consolidation, and created a dashboard-ready transformation layer with scalable update logic.'
            }),
            h(
              'div',
              { className: 'grid gap-5 lg:grid-cols-3' },
              ['Unified department schema', 'Central KPI master structure', 'Power Query consolidation', 'Dashboard-ready transformation layer', 'Scalable refresh/update logic', 'Management reporting workflow'].map((item, index) =>
                h(
                  motion.div,
                  {
                    key: item,
                    className: 'glass rounded-3xl p-6 transition duration-300 hover:-translate-y-1 hover:bg-white/[0.08]',
                    whileHover: { scale: 1.015 }
                  },
                  h('div', { className: 'mb-5 flex h-11 w-11 items-center justify-center rounded-2xl bg-cyan-300/10 text-sm font-bold text-cyan-200' }, String(index + 1).padStart(2, '0')),
                  h('h3', { className: 'text-xl font-semibold text-white' }, item),
                  h('p', { className: 'mt-3 text-sm leading-7 text-slate-400' }, 'Designed as a repeatable data operations layer so reporting can evolve without recreating the dashboard pipeline.')
                )
              )
            )
          ),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Technical Workflow',
              title: 'From departmental Excel files to executive KPI dashboards'
            }),
            h(
              'div',
              { className: 'glass overflow-hidden rounded-[2rem] p-4 sm:p-6' },
              h(
                'div',
                { className: 'grid gap-4 lg:grid-cols-5' },
                workflow.map((step, index) =>
                  h(
                    'div',
                    { key: step, className: 'relative rounded-3xl border border-white/10 bg-white/[0.04] p-5' },
                    h('div', { className: 'mb-5 h-1.5 rounded-full bg-gradient-to-r from-cyan-300 to-indigo-300', style: { width: `${54 + index * 10}%` } }),
                    h('p', { className: 'text-xs font-semibold uppercase tracking-[0.22em] text-slate-500' }, `Step ${index + 1}`),
                    h('h3', { className: 'mt-3 text-lg font-semibold leading-snug text-white' }, step),
                    index < workflow.length - 1 && h('div', { className: 'absolute -right-4 top-1/2 hidden h-px w-8 bg-cyan-200/40 lg:block' })
                  )
                )
              )
            )
          ),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Features',
              title: 'Built like a data product, not a spreadsheet patch'
            }),
            h(
              'div',
              { className: 'grid gap-5 md:grid-cols-2 lg:grid-cols-3' },
              features.map(([title, copy]) =>
                h(
                  motion.div,
                  { key: title, className: 'glass rounded-3xl p-6 transition duration-300 hover:-translate-y-1', whileHover: { y: -6 } },
                  h('div', { className: 'mb-5 h-12 w-12 rounded-2xl border border-cyan-200/20 bg-cyan-200/10' }),
                  h('h3', { className: 'text-xl font-semibold text-white' }, title),
                  h('p', { className: 'mt-3 text-sm leading-7 text-slate-400' }, copy)
                )
              )
            )
          ),
          h(
            Section,
            null,
            h(
              'div',
              { className: 'grid gap-7 lg:grid-cols-[.9fr_1.1fr]' },
              h(
                'div',
                null,
                h(SectionTitle, {
                  eyebrow: 'Data Transformation',
                  title: 'Wide monthly KPI files normalized into dashboard-ready long format',
                  copy: 'Departmental KPI sheets were reshaped from wide monthly layouts into a normalized long format. The model centralized KPI ownership, metric names, reporting periods, target values, actual values, and calculated status logic.'
                })
              ),
              h(
                'div',
                { className: 'glass rounded-[2rem] p-5' },
                h('div', { className: 'grid gap-4 md:grid-cols-2' },
                  h('div', { className: 'rounded-2xl border border-white/10 bg-white/[0.04] p-4' },
                    h('p', { className: 'text-xs uppercase tracking-[0.22em] text-slate-500' }, 'Before'),
                    h('h3', { className: 'mt-2 text-lg font-semibold text-white' }, 'Wide monthly KPI format'),
                    h('div', { className: 'mt-4 space-y-2 text-sm text-slate-400' }, ['KPI | Jan | Feb | Mar', 'Department-specific columns', 'Manual copy/paste updates'].map(row => h('p', { key: row, className: 'rounded-xl bg-white/[0.04] px-3 py-2' }, row)))
                  ),
                  h('div', { className: 'rounded-2xl border border-cyan-200/20 bg-cyan-200/10 p-4' },
                    h('p', { className: 'text-xs uppercase tracking-[0.22em] text-cyan-200' }, 'After'),
                    h('h3', { className: 'mt-2 text-lg font-semibold text-white' }, 'Normalized dashboard model'),
                    h('div', { className: 'mt-4 space-y-2 text-sm text-slate-200' }, ['Department | KPI | Period | Value', 'Shared schema', 'Refreshable transformation logic'].map(row => h('p', { key: row, className: 'rounded-xl bg-white/[0.06] px-3 py-2' }, row)))
                  )
                )
              )
            )
          ),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Dashboard Integration',
              title: 'A refreshable management KPI dashboard workflow',
              copy: 'The consolidated model was integrated into a management KPI dashboard template. The reporting workflow supports recurring refreshes, new department onboarding, and future extensibility for additional KPI views.'
            }),
            h(
              'div',
              { className: 'grid gap-5 lg:grid-cols-3' },
              ['Management KPI template integration', 'Refreshable reporting workflow', 'Future KPI and department extensibility'].map(item =>
                h('div', { key: item, className: 'glass rounded-3xl p-6' }, h('h3', { className: 'text-xl font-semibold text-white' }, item), h('p', { className: 'mt-3 text-sm leading-7 text-slate-400' }, 'Designed to support executive visibility without requiring repeated manual data reshaping.'))
              )
            )
          ),
          h(
            Section,
            null,
            h(SectionTitle, {
              eyebrow: 'Outcome / Impact',
              title: 'A cleaner operating rhythm for KPI management'
            }),
            h(
              'div',
              { className: 'grid gap-4 md:grid-cols-2 lg:grid-cols-4' },
              impact.map(([metric, label]) =>
                h('div', { key: label, className: 'glass rounded-3xl p-6 text-center' }, h('div', { className: 'text-3xl font-semibold text-white' }, metric), h('p', { className: 'mt-2 text-sm uppercase tracking-[0.18em] text-cyan-200/80' }, label))
              )
            )
          ),
          h(
            'footer',
            { className: 'relative z-10 mx-auto w-full max-w-7xl px-5 pb-12 pt-4 text-sm text-slate-500 sm:px-8 lg:px-10' },
            h('div', { className: 'hairline mb-8 h-px w-full' }),
            h('div', { className: 'flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between' },
              h('p', null, 'Enterprise KPI Consolidation & Dashboard Automation'),
              h('a', { href: 'index.html#projects', className: 'text-cyan-200 transition hover:text-white' }, 'Return to portfolio')
            )
          )
        );
      }

      createRoot(document.getElementById('root')).render(h(App));
    </script>
  </body>
</html>
